[project]
name = "clarify"
version = "2.9.0"
description = "System Management JSON Files - JSX/TSX Parameter Extractor"
authors = [
    {name = "Josué Amaral",email = "josueamaral15@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyside6 (>=6.9.3,<7.0.0)",
    "pyperclip>=1.8.2",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
    "python-docx>=1.1.0",
    "odfpy>=1.4.1",
    "toml (>=0.10.2,<0.11.0)",
    "pymongo (>=4.18.3,<5.0)",
    "toon-llm (>=1.0.0b6)",
    "openai (>=2.24.0,<3.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
]

[project.optional-dependencies]
excel = [
    "openpyxl>=3.1.0",
]
dev = [
    "black>=26.10.1",
    "pylint>=4.0.9",
    "isort>=5.0.0",
    "pre-commit>=3.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-qt>=4.3.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | old
  | add
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["old", "add", ".venv", "venv", "build", "dist"]
known_first_party = ["src"]
known_third_party = ["PySide6"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pylint.main]
jobs = 4
persistent = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0902",  # too-many-instance-attributes
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "C0301",  # line-too-long
    "W0107",  # unnecessary-pass
    "R1705",  # no-else-return
    "R0912",  # too-many-branches
    "W0212",  # protected-access
    "C0302",  # too-many-lines
]

[tool.pylint.format]
max-line-length = 120
max-module-lines = 2000

[tool.pylint.basic]
good-names = ["i", "j", "k", "e", "ex", "Run", "_", "fp", "fn", "f", "v", "s", "x", "y", "n", "m", "t", "r", "am", "rx", "j2", "cb", "ed", "chk", "btn"]

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-bool-expr = 5

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--timeout=10",
]
timeout_func_only = true
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (60s timeout)",
    "unit: marks tests as unit tests (10s timeout)",
    "timeout(seconds): set custom timeout for individual test",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/old/*",
    "*/add/*",
    "*/archive/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "pass",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
