# GitHub Actions CI/CD Pipeline for Clarify
# Runs tests with code coverage reporting on every push/PR
# Fails build if coverage < 80%

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libglib2.0-0 \
            libgl1 \
            libxrender1 \
            libxi6 \
            libxext6 \
            libx11-6
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6>=6.9.3
          pip install pytest>=8.0.0 pytest-cov>=4.1.0 pytest-timeout>=2.2.0 pytest-qt>=4.3.0
          pip install black>=23.0.0 pylint>=3.0.0 isort>=5.0.0
      
      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLUGIN_PATH: ""
          DISPLAY: ""
        run: |
          pytest tests/ \
            -v \
            --timeout=10 \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml \
            --cov-fail-under=70
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-clarify
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload coverage HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 30
  
  lint:
    name: Lint with Pylint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6>=6.9.3
          pip install pylint>=3.0.0
      
      - name: Run Pylint
        run: |
          pylint src/ \
            --disable=C0111,C0103,R0913,R0902,R0914,R0915,C0301,W0107,R1705,R0912,W0212,C0302 \
            --max-line-length=120 \
            --good-names=i,j,k,e,ex,Run,_,fp,fn,f,v,s,x,y,n,m,t,r,am,rx,j2,cb,ed,chk,btn \
            --fail-under=9.0 \
            --output-format=colorized
