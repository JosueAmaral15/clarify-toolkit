name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.1.3"
  POETRY_KEYRING_ENABLED: "false"

jobs:
  test:
    name: Tests and coverage (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_PLUGIN_PATH: ""
      DISPLAY: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 libegl1 libfontconfig1 libfreetype6 libgl1 \
            libglib2.0-0 libx11-6 libxext6 libxi6 libxrender1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install locked dependencies
        run: |
          python -m pip install "pip==26.2" "poetry==$POETRY_VERSION"
          poetry config virtualenvs.create false
          poetry install -E dev --no-root --no-interaction

      - name: Verify test collection
        run: pytest tests --collect-only -q --timeout=20

      - name: Run tests with coverage
        run: python scripts/ci/run_tests_by_module.py --timeout=20 --fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-clarify
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-3.12
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 30

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install locked dependencies
        run: |
          python -m pip install "pip==26.2" "poetry==$POETRY_VERSION"
          poetry config virtualenvs.create false
          poetry install -E dev --no-root --no-interaction

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts/ci

      - name: Check changed source files
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          mapfile -t files < <(git diff --diff-filter=ACMR --name-only "$base" "$GITHUB_SHA" -- 'src/*.py' 'src/**/*.py')
          if ((${#files[@]} == 0)); then
            echo "No changed source Python files."
            exit 0
          fi
          printf 'Checking %s\n' "${files[@]}"
          black --check -- "${files[@]}"
          isort --check-only -- "${files[@]}"
          pylint --errors-only --disable=no-name-in-module,import-error -- "${files[@]}"

  security:
    name: Locked dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install audit tools
        run: python -m pip install "pip==26.2" "poetry==$POETRY_VERSION" "pip-audit==2.10.0"

      - name: Validate lock
        run: poetry check --lock

      - name: Audit exact locked versions
        run: |
          python scripts/ci/export_locked_requirements.py poetry.lock > "$RUNNER_TEMP/locked-requirements.txt"
          pip-audit --requirement "$RUNNER_TEMP/locked-requirements.txt" --no-deps --disable-pip
