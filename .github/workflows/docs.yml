name: Build and Deploy API Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'docs/api/**'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  POETRY_VERSION: "2.1.3"
  POETRY_KEYRING_ENABLED: "false"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            poetry.lock
            requirements-docs.txt
          
      - name: Install dependencies
        run: |
          python -m pip install "pip==26.2" "poetry==$POETRY_VERSION"
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction
          python -m pip install --requirement requirements-docs.txt
          
      - name: Build Sphinx documentation
        run: make -C docs/api html SPHINXOPTS="--keep-going"
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/api/_build/html
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: update API documentation'
